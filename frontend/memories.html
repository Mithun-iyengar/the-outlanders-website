    /* ==================================================
       UNIFORM GALLERY CARD STYLING & ORGANIC MOTION
       ================================================== */
    .gallery-card {
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 16px;
      position: relative;
      background: #0B0F0E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      will-change: transform, box-shadow;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.35s ease;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
    }

    .gallery-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 11, 10, 0.0) 60%, rgba(8, 11, 10, 0.4) 100%);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      border-color: var(--accent-glow);
    }

    .gallery-card:hover img {
      transform: scale(1.05);
      filter: brightness(1.06);
    }

    /* Subtle Floating / Organic Motion for Desktop */
    @media(min-width: 992px) {
      .gallery-card.float-1 { animation: gentleFloat1 7s ease-in-out infinite alternate; }
      .gallery-card.float-2 { animation: gentleFloat2 8.5s ease-in-out infinite alternate 1.2s; }
      .gallery-card.float-3 { animation: gentleFloat3 6.5s ease-in-out infinite alternate 0.6s; }
      .gallery-card.float-4 { animation: gentleFloat4 9s ease-in-out infinite alternate 2s; }
    }

    @keyframes gentleFloat1 { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
    @keyframes gentleFloat2 { 0% { transform: translateY(0); } 100% { transform: translateY(-7px); } }
    @keyframes gentleFloat3 { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @keyframes gentleFloat4 { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      .gallery-card, .gallery-card img, .gallery-card.float-1, .gallery-card.float-2, .gallery-card.float-3, .gallery-card.float-4 {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Category Filter Tabs */
    .memories-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #D6D6D0;
      border-radius: 999px;
      padding: 0.45rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .memories-tab-btn:hover,
    .memories-tab-btn.active {
      background: var(--accent);
      color: #FFFFFF !important;
      border-color: var(--accent);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* Lightbox Modal Custom Overlay */
    .memories-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 8, 7, 0.96);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .memories-lightbox.show {
      opacity: 1;
      visibility: visible;
    }

    .memories-lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 10001;
    }

    .lightbox-nav-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-nav-btn.prev { left: 24px; }
    .lightbox-nav-btn.next { right: 24px; }

    .lightbox-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s ease;
      z-index: 10001;
    }

    .lightbox-close-btn:hover {
      background: #EF4444;
      border-color: #EF4444;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      color: #94A3B8;
      font-family: monospace;
      font-size: 0.88rem;
      letter-spacing: 0.1em;
    }
  </style>
