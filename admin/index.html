<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>THE OUTLANDERS — Admin Login</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-login-bg d-flex align-items-center justify-content-center min-vh-100 py-4 py-sm-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card login-card shadow-lg border-0">
          <div class="card-body p-4 p-sm-5">
            <!-- Logo & Brand Title Container -->
            <div class="text-center mb-4">
              <div class="logo-wrapper mb-3">
                <img src="../images/logo/outlanders-logo.png" alt="The Outlanders" class="admin-logo login-logo img-fluid"/>
              </div>
              <h4 class="fw-bold tracking-tight text-dark mb-1">ADMIN CONTROL CENTER</h4>
              <p class="text-muted small mb-0">Sign in to manage website content</p>
            </div>
            
            <div id="loginAlert"></div>
            
            <form id="loginForm" novalidate autocomplete="on">
              <div class="mb-3">
                <label class="form-label" for="username">Username or Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" id="username" class="form-control border-start-0" placeholder="admin" required autocomplete="username">
                  <div class="invalid-feedback">Please enter your username or email.</div>
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required autocomplete="current-password">
                  <div class="invalid-feedback">Please enter your password.</div>
                </div>
              </div>
              
              <div class="d-grid mb-3">
                <button class="btn btn-orange btn-login py-2.5" id="loginBtn" type="submit">
                  <i class="bi bi-box-arrow-in-right me-2"></i>SIGN IN
                </button>
              </div>
            </form>
            
            <div class="text-center pt-3 border-top">
              <p class="small text-secondary mb-0">
                <i class="bi bi-shield-check text-success me-1"></i> Encrypted via SHA-256 Web Crypto
              </p>
            </div>
          </div>
        </div>
        
        <div class="text-center mt-4">
          <a href="../frontend/index.html" class="text-decoration-none text-secondary small hover-underline">
            <i class="bi bi-arrow-left me-1"></i> Back to Public Website
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
