<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THE OUTLANDERS — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <img src="../images/logo/logo1.jpg" alt="The Outlanders" class="admin-logo mb-2"/>
              <h4 class="mb-0">ADMIN PANEL</h4>
            </div>
            <div id="loginAlert"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <input type="text" id="username" class="form-control" placeholder="admin" required>
                <div class="invalid-feedback">Please enter your username or email.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>
              <div class="d-grid">
                <button class="btn btn-orange" id="loginBtn" type="submit">LOGIN</button>
              </div>
            </form>
            <p class="small text-muted mt-3 mb-0 text-center"><i class="bi bi-shield-lock me-1"></i> Passwords are encrypted with SHA-256 Web Crypto.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
